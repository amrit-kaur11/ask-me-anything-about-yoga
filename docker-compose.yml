services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: askme_backend
    ports:
      - "8000:8000"
    env_file:
      - backend/storage/.env
    environment:
      - MONGODB_URL=mongodb://mongo:27017
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - mongo
    volumes:
      - ./backend/app:/app/app
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: askme_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: askme_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
